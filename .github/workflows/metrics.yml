name: Metrics

on:
  # Atualiza diariamente (ajuste o horário se quiser)
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente em "Actions"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "metrics/**"
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate metrics
        env:
          # PAT clássico (read:user, read:org, repo): inclui contribuições/orgs privadas.
          # Se estiver ausente ou inválido, o script cai para o GITHUB_TOKEN (só dados públicos).
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python metrics/generate_card.py --user kelsoncm --output github-metrics.svg

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "Sem alterações no card."
            exit 0
          fi
          git commit -m "chore(metrics): [UPD] Atualiza github-metrics.svg [skip ci]"
          git push
